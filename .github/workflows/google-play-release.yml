name: Google Play release

on:
  workflow_dispatch:
    inputs:
      track:
        description: Google Play track
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      release_status:
        description: Keep as draft until the release is reviewed
        required: true
        default: draft
        type: choice
        options:
          - draft
          - completed
      production_confirmation:
        description: Type RELEASE only for a completed production release
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: google-play-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build signed AAB and publish to ${{ inputs.track }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: ${{ inputs.track == 'production' && 'google-play-production' || 'google-play' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Validate required secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=0
          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD \
            GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Require explicit confirmation for completed production releases
        if: inputs.track == 'production' && inputs.release_status == 'completed'
        env:
          PRODUCTION_CONFIRMATION: ${{ inputs.production_confirmation }}
        run: |
          if [ "$PRODUCTION_CONFIRMATION" != "RELEASE" ]; then
            echo "::error::Set production_confirmation to RELEASE for a completed production release."
            exit 1
          fi

      - name: Reject development versions on the production track
        if: inputs.track == 'production'
        run: |
          version_name=""
          while IFS='=' read -r key value; do
            if [ "$key" = "appVersionName" ]; then
              version_name="$value"
            fi
          done < gradle.properties

          if [ -z "$version_name" ]; then
            echo "::error::appVersionName is missing from gradle.properties."
            exit 1
          fi

          case "$version_name" in
            *-dev*|*-alpha*|*-beta*|*-snapshot*|*-SNAPSHOT*)
              echo "::error::Development version '$version_name' cannot be published to production."
              exit 1
              ;;
          esac

      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          chmod 600 "$RUNNER_TEMP/upload-keystore.jks"

      - name: Test, lint and build signed app bundle
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:lintRelease
          :app:verifyReleaseManifest
          :app:bundleRelease
          --stacktrace

      - name: Upload signed AAB as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: google-play-${{ inputs.track }}-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: app/build/outputs/bundle/release/*.aab

      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.example.pocastcloni
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: ${{ inputs.track }}
          status: ${{ inputs.release_status }}
          mappingFile: app/build/outputs/mapping/release/mapping.txt
